        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ffd1dc, #e6e6fa, #cce7ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, .font-cute { font-family: 'Quicksand', sans-serif; }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Classes */
        .glass {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        .glass-dark {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            animation: float 8s infinite linear;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* Smooth Transitions */
        .fade-enter { opacity: 0; transform: translateY(20px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: all 0.5s ease-out; }
        
        /* Pulse & Heartbeat */
        .heartbeat { animation: heartbeat 1.5s ease-in-out infinite both; }
        @keyframes heartbeat {
            from { transform: scale(1); transform-origin: center center; animation-timing-function: ease-out; }
            10% { transform: scale(0.91); animation-timing-function: ease-in; }
            17% { transform: scale(0.98); animation-timing-function: ease-out; }
            33% { transform: scale(0.87); animation-timing-function: ease-in; }
            45% { transform: scale(1); animation-timing-function: ease-out; }
        }

        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>

            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            playSound('click');
            signOut(auth);
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-name').innerText = user.displayName.split(' ')[0];
                document.getElementById('user-avatar').src = user.photoURL;
                
                // Cek local storage untuk reconnect
                const savedRoom = localStorage.getItem('futari_room');
                const savedRole = localStorage.getItem('futari_role');
                if (savedRoom && savedRole) {
                    reconnectRoom(savedRoom, savedRole);
                } else {
                    showScreen('lobby');
                }
            } else {
                currentUser = null;
                showScreen('login');
                localStorage.removeItem('futari_room');
                localStorage.removeItem('futari_role');
            }
        });

        // ==========================================
        // ROOM LOGIC
        // ==========================================
        function generateRoomCode() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        document.getElementById('btn-create-room').addEventListener('click', async () => {
            playSound('click');
            const roomCode = generateRoomCode();
            const roomRef = ref(db, `rooms/${roomCode}`);
            
            // Pilih 10 pertanyaan random untuk session ini
            const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
            const selectedQuestions = shuffled.slice(0, 10);

            await set(roomRef, {
                createdAt: serverTimestamp(),
                state: 'waiting',
                questionIndex: 0,
                questions: selectedQuestions,
                score: 0,
                players: {
                    p1: {
                        uid: currentUser.uid,
                        name: currentUser.displayName.split(' ')[0],
                        photo: currentUser.photoURL,
                        online: true,
                        typing: false,
                        answer: ""
                    }
                }
            });

            joinGameEnv(roomCode, 'p1');
        });

        document.getElementById('btn-join-room').addEventListener('click', async () => {
            playSound('click');
            const code = document.getElementById('input-room-code').value.trim();
            if (code.length !== 4) return alert("Kode room harus 4 digit!");

            const roomRef = ref(db, `rooms/${code}`);
            const snapshot = await get(roomRef);

            if (snapshot.exists()) {
                const data = snapshot.val();
                if (!data.players.p2 || data.players.p2.uid === currentUser.uid) {
                    await update(child(roomRef, 'players/p2'), {
                        uid: currentUser.uid,
                        name: currentUser.displayName.split(' ')[0],
                        photo: currentUser.photoURL,
                        online: true,
                        typing: false,
                        answer: ""
                    });
                    // Start Game
                    if (data.state === 'waiting') {
                        await update(roomRef, { state: 'playing' });
                    }
                    joinGameEnv(code, 'p2');
                } else {
                    alert("Room sudah penuh!");
                }
            } else {
                alert("Room tidak ditemukan!");
            }
        });

        async function reconnectRoom(code, role) {
            const roomRef = ref(db, `rooms/${code}`);
            const snapshot = await get(roomRef);
            if (snapshot.exists()) {
                await update(child(roomRef, `players/${role}`), { online: true });
                joinGameEnv(code, role);
            } else {
                localStorage.removeItem('futari_room');
                showScreen('lobby');
            }
        }

        function joinGameEnv(code, role) {
            currentRoom = code;
            playerRole = role;
            localStorage.setItem('futari_room', code);
            localStorage.setItem('futari_role', role);
            
            document.getElementById('display-room-code').innerText = code;
            showScreen('game');
            playSound('join');

            // Setup Disconnect handler
            const playerOnlineRef = ref(db, `rooms/${code}/players/${role}/online`);
            onDisconnect(playerOnlineRef).set(false);

            listenToRoom(code);
        }

        // ==========================================
        // GAMEPLAY SYNC LOGIC
        // ==========================================
        function listenToRoom(code) {
            if (unsubscribeRoom) unsubscribeRoom();
            
            const roomRef = ref(db, `rooms/${code}`);
            unsubscribeRoom = onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return; // Room deleted

                updateUI(data);
                checkGameLogic(data, roomRef);
            });
        }

        function updateUI(data) {
            // Update Player 1
            if (data.players.p1) {
                document.getElementById('p1-name').innerText = data.players.p1.name;
                document.getElementById('p1-avatar').src = data.players.p1.photo;
                document.getElementById('p1-status').className = `absolute bottom-0 right-0 w-4 h-4 rounded-full border-2 border-white ${data.players.p1.online ? 'bg-green-400' : 'bg-gray-400'}`;
            }

            // Update Player 2
            if (data.players.p2) {
                document.getElementById('p2-name').innerText = data.players.p2.name;
                document.getElementById('p2-avatar').src = data.players.p2.photo;
                document.getElementById('p2-status').className = `absolute bottom-0 right-0 w-4 h-4 rounded-full border-2 border-white ${data.players.p2.online ? 'bg-green-400' : 'bg-gray-400'}`;
            }

            // Typing Indicator
            const otherRole = playerRole === 'p1' ? 'p2' : 'p1';
            const typingEl = document.getElementById('typing-indicator');
            if (data.players[otherRole] && data.players[otherRole].typing) {
                typingEl.innerText = `${data.players[otherRole].name} sedang mengetik...`;
            } else {
                typingEl.innerText = "";
            }

            // Score & Progress Bar
            const totalQuestions = data.questions ? data.questions.length : 10;
            const progress = (data.score / totalQuestions) * 100;
            document.getElementById('score-display').innerText = `${Math.round(progress)}%`;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Game States
            if (data.state === 'waiting') {
                document.getElementById('game-state-waiting').classList.remove('hidden');
                document.getElementById('game-state-playing').classList.add('hidden');
                document.getElementById('action-bar').classList.add('hidden');
            } 
            else if (data.state === 'playing') {
                document.getElementById('game-state-waiting').classList.add('hidden');
                document.getElementById('game-state-playing').classList.remove('hidden');
                document.getElementById('action-bar').classList.remove('hidden');
                document.getElementById('reveal-area').classList.add('hidden');
                
                if (data.questions) {
                    document.getElementById('question-text').innerText = data.questions[data.questionIndex];
                }

                // Check if I already answered
                const myAnswer = data.players[playerRole].answer;
                const inputEl = document.getElementById('input-answer');
                const btnEl = document.getElementById('btn-submit');
                
                if (myAnswer !== "") {
                    inputEl.value = "Menunggu doi menjawab...";
                    inputEl.disabled = true;
                    btnEl.disabled = true;
                    btnEl.classList.replace('bg-pink-500', 'bg-gray-400');
                } else {
                    inputEl.disabled = false;
                    btnEl.disabled = false;
                    btnEl.classList.replace('bg-gray-400', 'bg-pink-500');
                    if(inputEl.value === "Menunggu doi menjawab...") inputEl.value = "";
                }
            }
            else if (data.state === 'revealing') {
                document.getElementById('action-bar').classList.add('hidden');
                document.getElementById('reveal-area').classList.remove('hidden');
                document.getElementById('reveal-area').classList.add('flex');
                
                document.getElementById('reveal-p1-name').innerText = data.players.p1.name;
                document.getElementById('reveal-p2-name').innerText = data.players.p2.name;
                
                const ans1 = document.getElementById('reveal-p1-answer');
                const ans2 = document.getElementById('reveal-p2-answer');
                
                ans1.innerText = data.players.p1.answer;
                ans2.innerText = data.players.p2.answer;
                
                // Remove blur effect
                setTimeout(() => {
                    ans1.classList.remove('blur-md');
                    ans2.classList.remove('blur-md');
                }, 500);
            }
        }

        async function checkGameLogic(data, roomRef) {
            // Logic dijalankan oleh P1 (sebagai 'Host' sederhana) untuk menghindari double trigger
            if (playerRole !== 'p1') return;

            if (data.state === 'playing') {
                const ans1 = data.players.p1?.answer;
                const ans2 = data.players.p2?.answer;

                // Jika keduanya sudah jawab
                if (ans1 && ans2 && ans1 !== "" && ans2 !== "") {
                    await update(roomRef, { state: 'revealing' });
                    
                    // Simple Similarity Check
                    const s1 = ans1.toLowerCase().trim();
                    const s2 = ans2.toLowerCase().trim();
                    let isMatch = false;
                    
                    if (s1 === s2 || s1.includes(s2) || s2.includes(s1)) {
                        isMatch = true;
                    }

                    // Show Result Locally then sync
                    setTimeout(async () => {
                        const resultEl = document.getElementById('match-result');
                        resultEl.classList.remove('hidden');
                        if (isMatch) {
                            resultEl.innerText = "✨ COCOK! ✨";
                            resultEl.className = "hidden text-3xl font-cute font-bold text-center mt-4 text-pink-500 heartbeat";
                            playSound('match');
                            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#ff69b4', '#9370db', '#87cefa'] });
                            await update(roomRef, { score: data.score + 1 });
                        } else {
                            resultEl.innerText = "😅 BEDA JAWABAN 😅";
                            resultEl.className = "hidden text-2xl font-cute font-bold text-center mt-4 text-gray-500";
                            playSound('click');
                        }

                        // Next Question
                        setTimeout(async () => {
                            resultEl.classList.add('hidden');
                            document.getElementById('reveal-p1-answer').classList.add('blur-md');
                            document.getElementById('reveal-p2-answer').classList.add('blur-md');
                            
                            const nextIndex = data.questionIndex + 1;
                            if (nextIndex < data.questions.length) {
                                await update(roomRef, {
                                    state: 'playing',
                                    questionIndex: nextIndex,
                                    'players/p1/answer': "",
                                    'players/p2/answer': ""
                                });
                            } else {
                                // Game Over - Reset
                                alert(`Game Selesai! Chemistry Kalian: ${Math.round((data.score / data.questions.length) * 100)}%`);
                                localStorage.removeItem('futari_room');
                                location.reload();
                            }
                        }, 4000);

                    }, 1000);
                }
            }
        }

        // ==========================================
        // INPUT HANDLING
        // ==========================================
        let typingTimer;
        const inputAnswer = document.getElementById('input-answer');
        
        inputAnswer.addEventListener('input', () => {
            if (!currentRoom || !playerRole) return;
            update(ref(db, `rooms/${currentRoom}/players/${playerRole}`), { typing: true });
            
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                update(ref(db, `rooms/${currentRoom}/players/${playerRole}`), { typing: false });
            }, 1000);
        });

        document.getElementById('btn-submit').addEventListener('click', async () => {
            playSound('click');
            const val = inputAnswer.value.trim();
            if (val === "") return;

            if (currentRoom && playerRole) {
                await update(ref(db, `rooms/${currentRoom}/players/${playerRole}`), { 
                    answer: val,
                    typing: false 
                });
                inputAnswer.value = "";
            }
        });

        // Enter key to submit
        inputAnswer.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('btn-submit').click();
        });

    </script>
</body>
</html>
